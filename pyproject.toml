[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amortissements"
version = "0.1.0"
description = "Plans d'amortissement linéaire et dégressif selon les règles comptables et fiscales françaises"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Théo Pasquier" }]
keywords = ["amortissement", "dégressif", "linéaire", "comptabilité", "immobilisations", "France"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
amortissements = "amortissements.__main__:main"

[project.urls]
Homepage = "https://github.com/TheoPSR01/amortissements"
Issues = "https://github.com/TheoPSR01/amortissements/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/amortissements"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
